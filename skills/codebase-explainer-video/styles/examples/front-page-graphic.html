<!doctype html>
<html><head><meta charset="utf-8"><title>Front Page Graphic</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Libre+Franklin:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--paper:#FAF8F3;--ink:#1A1A1A;--grey:#6B6B6B;--orange:#D9531E;--blue:#2F6DB5;--wash:#FCE8C8}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Libre Franklin",sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:896px;transform-origin:50% 45%}
.frame{position:absolute;left:56px;top:40px;right:56px;bottom:20px;border:1px solid #D9D5CC}
.abs{position:absolute}
#kicker{left:120px;top:76px;font-weight:700;font-size:19px;letter-spacing:.16em;color:var(--grey)}
#kicker b{color:var(--orange);font-weight:700}
#head{left:120px;top:112px;font-family:Newsreader,serif;font-weight:600;font-size:64px;line-height:1.05;letter-spacing:-.01em;white-space:nowrap;transform-origin:0 0}
#head span{display:inline-block}
#rule{position:absolute;left:0;right:0;bottom:-2px;height:4px;background:var(--orange);transform-origin:0 50%}
#dek{left:120px;top:196px;font-size:24px;color:var(--grey);width:900px;line-height:1.4}
svg{position:absolute;left:0;top:0}
.lbl{font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--grey)}
.node{position:absolute;background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:16px 22px}
.node .t{font-size:28px;font-weight:600;margin-top:4px}
#fn{left:760px;top:330px;width:400px;height:130px;border:2px solid var(--ink);border-radius:14px;background:#fff;text-align:center;padding-top:22px}
#fn .code{font-family:"IBM Plex Mono",monospace;font-size:42px;font-weight:500;margin-top:6px}
#spec{left:760px;top:486px;width:400px;background:#fff;border:1px solid #DDD8CE;border-radius:8px;padding:14px 0;font-family:"IBM Plex Mono",monospace;font-size:19px;line-height:32px}
#spec .ln{position:relative;padding-left:56px;white-space:pre}
#spec .ln i{position:absolute;left:18px;font-style:normal;color:#A8A39A}
#spec .wash{position:absolute;left:0;top:0;bottom:0;right:0;background:var(--wash);transform-origin:0 50%}
#spec .ln span{position:relative}
#pure{left:1236px;top:214px;width:420px}
#pure .a{font-size:27px;font-weight:700}
#pure .b{font-size:24px;color:var(--grey);margin-top:4px}
#pure .w{display:inline-block}
.ghost{position:absolute;font-size:24px;color:#8E8A83;text-align:center;width:240px}
#neither{left:820px;top:774px;width:280px;text-align:center;font-family:Newsreader,serif;font-style:italic;font-size:30px;color:var(--orange)}
#source{left:120px;top:840px;font-size:15px;color:#9A968E;letter-spacing:.02em}
#caps{position:absolute;left:0;top:896px;width:1920px;height:184px;border-top:1px solid #E2DED5;background:var(--paper)}
.cap-group{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Libre Franklin",sans-serif;font-size:42px;font-weight:600;letter-spacing:-.005em}
.cap-word{color:var(--ink);opacity:calc(.32 + .68*var(--on,0));margin:0 .12em}
</style></head><body>
<div id="stage">
  <div class="frame"></div>
  <div id="kicker" class="abs">HOW IT WORKS <b>·</b> CONFIG V2</div>
  <div id="head" class="abs"><span id="h1">The</span> <span id="h2">biggest</span> <span id="h3" style="position:relative">change<i id="rule"></i></span></div>
  <div id="dek" class="abs">Device configs are now computed, not stored.</div>

  <svg width="1920" height="896" viewBox="0 0 1920 896">
    <defs><marker id="dt" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" fill="#1A1A1A"/></marker></defs>
    <!-- leader for pure -->
    <path id="lead" d="M1130 330 L1130 250 L1222 250" fill="none" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle id="leadDot1" cx="1130" cy="330" r="4" fill="#1A1A1A"/>
    <circle id="leadDot2" cx="1222" cy="250" r="4" fill="#1A1A1A"/>
    <!-- flow curves -->
    <path id="cIn" d="M480 395 C580 300 660 300 760 395" fill="none" stroke="#2F6DB5" stroke-width="2.5"/>
    <path id="cOut" d="M1160 395 C1260 300 1340 300 1440 395" fill="none" stroke="#2F6DB5" stroke-width="2.5"/>
    <circle id="dot" r="8" fill="#2F6DB5"/>
    <!-- ghosts -->
    <g id="gDb" stroke="#9A968E" stroke-width="2" fill="none">
      <ellipse cx="620" cy="724" rx="54" ry="15"/><path d="M566 724 V786 A54 15 0 0 0 674 786 V724"/><path d="M566 755 A54 15 0 0 0 674 755" stroke-dasharray="5 5"/>
    </g>
    <g id="gHi" stroke="#9A968E" stroke-width="2" fill="none">
      <circle cx="1300" cy="752" r="44"/><path d="M1300 752 V722 M1300 752 L1322 764"/><circle cx="1300" cy="752" r="3" fill="#9A968E"/>
    </g>
    <path id="dDb" d="M880 612 C860 670 760 712 690 724" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-dasharray="6 7"/>
    <path id="dHi" d="M1040 612 C1060 670 1160 712 1238 736" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-dasharray="6 7"/>
    <g id="xDb" stroke="#D9531E" stroke-width="4" stroke-linecap="round"><path id="xDb1" d="M778 662 L806 690"/><path id="xDb2" d="M806 662 L778 690"/></g>
    <g id="xHi" stroke="#D9531E" stroke-width="4" stroke-linecap="round"><path id="xHi1" d="M1118 662 L1146 690"/><path id="xHi2" d="M1146 662 L1118 690"/></g>
  </svg>

  <div id="snap" class="node" style="left:212px;top:350px;width:268px"><div class="lbl">INPUT</div><div class="t">Device snapshot</div></div>
  <div id="cfg" class="node" style="left:1440px;top:350px;width:268px"><div class="lbl">OUTPUT</div><div class="t">Config</div></div>
  <div id="fn" class="abs"><div class="lbl">THE FUNCTION</div><div class="code">buildConfig()</div></div>
  <div id="spec" class="abs">
    <div class="ln"><b class="wash" id="wash"></b><i>1</i><span>export function buildConfig(</span></div>
    <div class="ln"><i>2</i><span>  snap: DeviceSnapshot</span></div>
    <div class="ln"><i>3</i><span>): DeviceConfig</span></div>
  </div>
  <div id="pure" class="abs"><div class="a"><span class="w">Pure</span> <span class="w">function:</span></div><div class="b"><span class="w">same</span> <span class="w">input</span> <span class="w">→</span> <span class="w">same</span> <span class="w">output</span></div></div>
  <div class="ghost" id="tDb" style="left:500px;top:806px">database</div>
  <div class="ghost" id="tHi" style="left:1180px;top:806px">history</div>
  <div id="neither" class="abs">touches neither</div>
</div>
<div id="caps"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="../lab.js"></script>
<script>
document.fonts.ready.then(() => {
  const tl = LAB.tl, C = LAB.cue, $ = (s) => document.querySelector(s);
  const rise = (el, t, d = 0.4) => tl.fromTo(el, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: d, ease: "power2.out" }, t);
  const draw = (el, t, d, ease = "power1.inOut") => { const L = el.getTotalLength(); el.style.strokeDasharray = L;
    tl.fromTo(el, { strokeDashoffset: L, autoAlpha: 0 }, { strokeDashoffset: 0, autoAlpha: 1, duration: d, ease }, t); };
  // dashed path drawn on: grow the dash list one 6/7 segment at a time
  const drawDashed = (el, t, d) => { const L = el.getTotalLength(), segs = Math.ceil(L / 13), p = { n: 0 };
    const set = () => { const a = []; for (let i = 0; i < Math.round(p.n); i++) a.push(6, 7); a.push(0, L * 2); el.setAttribute("stroke-dasharray", a.join(" ")); };
    set(); tl.fromTo(p, { n: 0 }, { n: segs, duration: d, ease: "none", onUpdate: set }, t); };

  // slow 3% push across the whole clip
  tl.fromTo("#stage", { scale: 1 }, { scale: 1.03, duration: LAB.DUR, ease: "none" }, 0);

  // 1. kicker + headline
  rise("#kicker", 0.0);
  const head = $("#head"); const hb = head.getBoundingClientRect(); const big = 2.3;
  const bx = (1920 - hb.width * big) / 2 - 120, by = 300 - 112;
  tl.fromTo(head, { x: bx, y: by, scale: big }, { x: 0, y: 0, scale: 1, duration: 0.7, ease: "power3.inOut" }, C("build"));
  rise("#h1", C("the"), 0.3); rise("#h2", C("biggest"), 0.35); rise("#h3", C("change"), 0.35);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, C("change") + 0.2);
  rise("#dek", C("build") + 0.5);

  // 2. the function box + specimen + pure annotation
  rise("#fn", C("config"));
  rise("#spec", C("is"));
  tl.fromTo(["#leadDot1", "#leadDot2"], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15, stagger: 0.32 }, C("pure"));
  draw($("#lead"), C("pure"), 0.35);
  tl.fromTo("#pure .w", { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: 0.25, stagger: 0.06, ease: "power2.out" }, C("pure") + 0.3);
  tl.fromTo("#wash", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, C("function"));

  // 3. snapshot goes in (dim the pure annotation: max two annotations)
  tl.to(["#pure", "#lead", "#leadDot1", "#leadDot2"], { opacity: 0.3, duration: 0.4 }, C("a", 2) - 0.6);
  rise("#snap", C("snapshot"));
  const cIn = $("#cIn"), cOut = $("#cOut"), dot = $("#dot");
  draw(cIn, C("goes"), 0.44, "none");
  const at = (path, p) => { const L = path.getTotalLength(), q = path.getPointAtLength(L * p); dot.setAttribute("cx", q.x); dot.setAttribute("cy", q.y); };
  const travel = (path, t0, t1) => { const pr = { p: 0 }; tl.fromTo(pr, { p: 0 }, { p: 1, duration: t1 - t0, ease: "none", onUpdate: () => at(path, pr.p) }, t0); };
  tl.fromTo(dot, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05 }, C("goes"));
  travel(cIn, C("goes"), 5.68);
  tl.fromTo("#fn", { borderColor: "#1A1A1A" }, { borderColor: "#2F6DB5", duration: 0.15, yoyo: true, repeat: 1 }, 5.68);
  tl.to(dot, { autoAlpha: 0, duration: 0.1 }, 5.68);

  // 4. config comes out
  rise("#cfg", C("config", 2));
  draw(cOut, C("comes"), 0.52, "none");
  tl.to(dot, { autoAlpha: 1, duration: 0.05 }, C("comes"));
  travel(cOut, C("comes"), 7.04);
  tl.to(dot, { autoAlpha: 0, duration: 0.15 }, 7.04);
  tl.to("#cfg", { borderColor: "#2F6DB5", boxShadow: "0 0 0 4px #2F6DB533", duration: 0.25 }, 7.04);

  // 5. no database, no history: dim the rest, ghosts + cut lines
  tl.to(["#snap", "#cfg", "#cIn", "#cOut", "#pure", "#lead", "#leadDot1", "#leadDot2", "#dek"], { opacity: 0.35, duration: 0.4 }, C("no"));
  tl.fromTo(["#gDb", "#tDb"], { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, C("no"));
  drawDashed($("#dDb"), C("no") + 0.05, 0.3);
  draw($("#xDb1"), C("database") + 0.12, 0.12, "power2.in"); draw($("#xDb2"), C("database") + 0.26, 0.12, "power2.in");
  tl.fromTo(["#gHi", "#tHi"], { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, C("no", 2));
  drawDashed($("#dHi"), C("no", 2) + 0.05, 0.3);
  draw($("#xHi1"), C("history") + 0.12, 0.12, "power2.in"); draw($("#xHi2"), C("history") + 0.26, 0.12, "power2.in");
  rise("#neither", C("history") + 0.55);

  LAB.captions($("#caps"));
  LAB.done();
  const seek = window.__seek; window.__seek = (t) => { seek(t); }; // return nothing: Playwright would try to serialise the timeline
});
</script>
</body></html>
